<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Chat Socket.IO UNA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font: 13px Helvetica, Arial; }
      form { background: #000; padding: 3px; position: fixed; bottom: 0; width: 100%; }
      form input { border: 0; padding: 10px;}
      form button { width: 10%; background: rgb(130, 224, 255);  border: none; padding: 10px; }
      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages li { padding: 5px 10px; }
      #messages li:nth-child(odd) { background: #eee; }
      #messages { margin-bottom: 40px }
      #nombre, #m { display: inline-block;}
      #m {width: 69%; margin-right: 4px;}
      #nombre {width: 20%}
      /* Lab 8: barra de sesion y pantalla de inicio de sesion (Auth0) */
      #session-bar { display: flex; align-items: center; gap: 10px; padding: 10px; background: #f4f4f4; border-bottom: 1px solid #ddd; }
      #session-bar button, #login-gate button { border: none; padding: 8px 14px; cursor: pointer; background: rgb(130, 224, 255); }
      #session-name { font-weight: bold; }
      #login-gate { max-width: 360px; margin: 40px auto; padding: 20px; border: 1px solid #ddd; text-align: center; }
      #login-gate h2 { margin-bottom: 10px; }
      #login-gate p { margin-bottom: 14px; }
      #login-error { color: #a00000; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="session-bar" hidden>
      <button type="button" id="logout-button">Cerrar sesión</button>
      <span id="session-name"></span>
    </div>
    <section id="login-gate" hidden>
      <h2>UNA Chat</h2>
      <p>La sala pide una sesión. Inicia sesión para entrar.</p>
      <p id="login-error" hidden role="alert"></p>
      <button type="button" id="login-button">Iniciar sesión</button>
    </section>
    <ul id="messages"></ul>
    <form action="" id="composer">
      <input id="nombre" autocomplete="off" placeholder="Username"/>
      <input id="m" autocomplete="off" placeholder="Escriba un mensaje" maxlength="500" /><button>Send</button>
    </form>
    <script src="https://cdn.socket.io/4.7.2/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-1.11.1.js"></script>
    <script>

    var colorHexTxt = "";

    // genera colores aleatorios en hexadeximal
    function getRandomColor() {
        var letters = '0123456789ABCDEF';
        var color = '#';
        for (var i = 0; i < 6; i++) {
          color += letters[Math.floor(Math.random() * 16)];
        }

        return color;
     }

      // Lab 8: el socket se prepara de inmediato pero se conecta solo cuando el chat puede abrirse
      // (sin Auth0, o con una sesion valida). La cookie de sesion viaja en el handshake.
      var socket = null;

      function prepareChat() {
        socket = io({ transports: ['websocket'], autoConnect: false });

        // emite evento al servidor
        $('form').submit(function(){
            var nombreTxt = $('#nombre').val() || "Anomimo";
            var mensajeTxt = $('#m').val();

            if (colorHexTxt == "") {
                colorHexTxt = getRandomColor();
            }

            var jsonMsg = { nombre: nombreTxt, mensaje: mensajeTxt, color: colorHexTxt };
            socket.emit('Evento-Mensaje-Server', JSON.stringify(jsonMsg));
            $('#m').val('');
            return false;
        });

        socket.on('connect_error', function () {
            if (!$('#session-bar').prop('hidden')) {
                showLogin('No se pudo conectar al chat. Inicia sesión de nuevo.');
            }
        });

        socket.on('Evento-Mensaje-Server', function(msg){
            var msgJson = JSON.parse(msg);
            var mensajeDisplay = "<b style='color:"+ msgJson.color +"'>" + msgJson.nombre + "</b>: " + msgJson.mensaje;
            $('#messages').append($('<li>').html(mensajeDisplay));
            window.scrollTo(0, document.body.scrollHeight);
        });
      }

      function startChat() {
        socket.connect();
      }

      // Lab 8: pantalla de inicio de sesion
      function showLogin(message) {
        $('#composer').prop('hidden', true);
        $('#messages').prop('hidden', true);
        $('#session-bar').prop('hidden', true);
        $('#session-name').text('');
        $('#login-button').prop('disabled', false).text('Iniciar sesión');
        $('#login-gate').prop('hidden', false);
        $('#login-error').prop('hidden', !message).text(message || '');
        $('#login-button').off('click').on('click', function () {
            this.disabled = true;
            this.textContent = 'Entrando…';
            window.location.assign('/auth/login');
        });
      }

      // Lab 8: sesion abierta, se muestra el nombre y el boton Cerrar sesion
      function showSignedIn(user) {
        var name = user && typeof user.name === 'string' ? user.name.trim() : '';
        var label = name || 'Usuario';
        $('#session-name').text(label);
        $('#nombre').val(label).prop('readonly', true);
        $('#login-gate').prop('hidden', true);
        $('#session-bar').prop('hidden', false);
        $('#messages').prop('hidden', false);
        $('#composer').prop('hidden', false);
        $('#logout-button').off('click').on('click', function () {
            this.disabled = true;
            this.textContent = 'Cerrando sesión…';
            window.location.assign('/auth/logout');
        });
        startChat();
      }

      function loginErrorFromParams(params) {
        var code = params.get('error') || '';
        if (!code) return '';
        if (code === 'access_denied') return 'Cancelaste el inicio de sesión. Puedes intentarlo de nuevo.';
        if (code === 'state') return 'La sesión de entrada venció. Inténtalo de nuevo.';
        return 'No se pudo iniciar sesión. Inténtalo de nuevo.';
      }

      $(function () {
        prepareChat();

        fetch('/auth/config').then(function (response) {
            return response.json();
        }).then(function (config) {
            // Sin Auth0 configurado el chat funciona como en los laboratorios anteriores
            if (!config || !config.enabled) {
                startChat();
                return;
            }

            var params = new URLSearchParams(window.location.search);
            var redirectError = loginErrorFromParams(params);
            if (params.has('error') || params.has('code') || params.has('state')) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            return fetch('/sala', { headers: { accept: 'application/json' } }).then(function (response) {
                if (response.status === 401) {
                    showLogin(redirectError);
                    return;
                }
                if (!response.ok) {
                    showLogin('No se pudo comprobar la sesión. Recarga la página.');
                    return;
                }
                return response.json().then(showSignedIn);
            });
        }).catch(function () {
            showLogin('No se pudo comprobar la sesión. Recarga la página.');
        });
      });
    </script>
  </body>
</html>
